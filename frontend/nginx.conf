server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # single-page app: unknown paths (/incidents/INC-0001, /evaluation, ...) load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets can be cached for a long time; index.html never
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
