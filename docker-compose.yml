# Threat Console: the whole system in containers.
#
#   cp .env.example .env            # then set NEO4J_PASSWORD, API_KEY and (optional) GROQ_API_KEY
#   docker compose up -d --build    # first build takes a while (PyTorch, embedding model)
#
#   Console          http://localhost:8080        (the only service meant for users; the API is at /api behind it)
#   API              http://localhost:8000/docs   (this machine only)
#   Neo4j Browser    http://localhost:7474        (this machine only; user neo4j, password NEO4J_PASSWORD)
#
# Only the console port is published to the network. The backend, Neo4j, Chroma and DynamoDB Local are bound to
# 127.0.0.1 (for debugging on the host) and otherwise reachable only on the compose network. Chroma and DynamoDB
# Local have no authentication, so never publish their ports.
#
# Data that is not in the images is mounted from backend/data (checkpoints, test edges, knowledge files,
# metrics.json); see backend/README.md, "Run with Docker". On AWS the same files come from S3.
name: threat-console

services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (8+ characters)}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  chroma:
    build: ./infra/chroma
    volumes:
      - chroma-data:/data
    ports:
      - "127.0.0.1:8001:8000"

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "127.0.0.1:8002:8000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      DATA_DIR: /app/backend/data
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDACT_IPS: ${REDACT_IPS:-true}
      RETRIEVER: graph
      RERANK: ${RERANK:-false}          # off: no measured gain (DEPLOYMENT.md); the model is baked in, so true needs no rebuild
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      INCIDENT_STORE: dynamodb
      DYNAMODB_TABLE: threat-console-incidents
      # DynamoDB Local by default. On AWS set DYNAMODB_ENDPOINT= (empty) in .env: the backend then uses the real
      # service with the instance role. Local mode needs no credentials (the backend uses dummy ones for it).
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT-http://dynamodb:8000}
      DYNAMODB_CREATE_TABLE: ${DYNAMODB_CREATE_TABLE:-true}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      # the browser reaches the API through the console's /api proxy (same origin); these are for local dev servers
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # the ATT&CK STIX file, if it is not in backend/data/knowledge
      ATTACK_STIX: ${ATTACK_STIX:-/app/demo/2026-10-06_meeting/app/data/rag/enterprise-attack.json}
    volumes:
      - ./backend/data:/app/backend/data
      - ./demo/2026-10-06_meeting/app/data/rag:/app/demo/2026-10-06_meeting/app/data/rag:ro
    ports:
      - "127.0.0.1:8000:8000"
    # started, not healthy: Neo4j and Chroma are optional (the backend waits for them for a while and otherwise
    # falls back to the in-memory graph and the local index), so their outage must not keep the API down
    depends_on:
      neo4j:
        condition: service_started
      chroma:
        condition: service_started
      dynamodb:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      # nginx adds the key when it proxies /api to the backend; it is not in the browser bundle
      API_KEY: ${API_KEY:?set API_KEY in .env}
      BACKEND_URL: http://backend:8000
      # optional login for the console (recommended on AWS)
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "${CONSOLE_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  neo4j-data:
  chroma-data:
  dynamodb-data:
