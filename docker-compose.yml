# Local services for the Threat Console.
# Now: Neo4j for GraphRAG. Next step: backend, frontend, Chroma and DynamoDB Local are added here.
#
#   docker compose up -d neo4j                         # start Neo4j (browser: http://localhost:7474)
#   cd backend && python scripts/load_neo4j.py --check  # load the ATT&CK graph and compare with the in-memory graph
#
# The password comes from NEO4J_PASSWORD in a .env file next to this one (at least 8 characters).
services:
  neo4j:
    image: neo4j:5-community
    container_name: threat-console-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (the backend and load_neo4j.py)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 12

volumes:
  neo4j-data:
